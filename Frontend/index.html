<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MainCrafts | Contact</title>

    <!-- Professional Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HERO -->
    <section class="hero">
        <div class="hero-content">
            <h1>Build Better Digital Experiences</h1>
            <p>We design and develop modern, scalable web applications.</p>
            <a href="#contact" class="btn">Get in Touch</a>
        </div>
    </section>

    <!-- CONTACT -->
    <section id="contact" class="contact">
        <div class="contact-card">
            <h2>Contact Us</h2>
            <p>Have a project or idea? Let’s talk.</p>

            <form action="http://localhost:8080/contact" method="post">
                <input type="text" name="name" placeholder="Full Name" required>
                <input type="email" name="email" placeholder="Email Address" required>
                <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>
    </section>

</body>
</html>
